version: 2

models:
  - name: dim_date
    description: "Date dimension for reporting. Facts keep exact UTC timestamps; date_id is derived for slicing."
    columns:
      - name: date_id
        tests: [unique, not_null]
  - name: dim_time_of_day
    description: "Optional time-of-day dimension for diurnal analysis without exploding date dim."
    columns:
      - name: time_of_day_id
        tests: [unique, not_null]
  - name: dim_organization
    description: "Organization dimension representing districts, schools and other institutions."
    columns:
      - name: organization_id
        tests: [unique, not_null]
  - name: dim_person
    description: "Conformed person dim to avoid duplicated learner/teacher dimensions. Use role/membership bridges for context."
    columns:
      - name: person_id
        tests: [unique, not_null]
  - name: dim_academic_term
    description: "Academic calendar/terms for Ed-Fi-aligned slicing and cohort attribution."
    columns:
      - name: term_id
        tests: [unique, not_null]
  - name: dim_course
    description: "Course dimension – logical courses/classes over which sections and content are organized."
    columns:
      - name: course_id
        tests: [unique, not_null]
  - name: dim_section
    description: "Section/class dimension – concrete teaching groups."
    columns:
      - name: section_id
        tests: [unique, not_null]
  - name: dim_content
    description: "Content/activity objects; not necessarily assessment items."
    columns:
      - name: content_id
        tests: [unique, not_null]
  - name: dim_assessment
    description: "Assessment dimension – logical collections of items used to measure performance."
    columns:
      - name: assessment_id
        tests: [unique, not_null]
  - name: dim_assessment_item
    description: "Item dimension for item analysis, psychometrics, and mastery modeling."
    columns:
      - name: item_id
        tests: [unique, not_null]
  - name: dim_skill
    description: "Skill dimension – structured competency graph."
    columns:
      - name: skill_id
        tests: [unique, not_null]
  - name: dim_standard
    description: "Standards/outcomes graph, Ed-Fi/analytics friendly."
    columns:
      - name: standard_id
        tests: [unique, not_null]
  - name: dim_session
    description: "Session dimension – windows of learner interaction."
    columns:
      - name: session_id
        tests: [unique, not_null]
  - name: dim_platform
    description: "Platform dimension – LMSes, apps, and services that send telemetry."
    columns:
      - name: platform_id
        tests: [unique, not_null]
  - name: dim_lti_tool
    description: "LTI tool dimension – distinct LTI integrations."
    columns:
      - name: lti_tool_id
        tests: [unique, not_null]
  - name: dim_ai_tool
    description: "AI tool dimension – assistant/bot configurations."
    columns:
      - name: ai_tool_id
        tests: [unique, not_null]
  - name: dim_device
    description: "Device dimension for experience, performance, abuse analytics."
    columns:
      - name: device_id
        tests: [unique, not_null]
  - name: ref_event_type
    description: "Reference table for coarse event buckets."
    columns:
      - name: event_type_key
        tests: [unique, not_null]
  - name: ref_verb
    description: "Reference table mapping raw statement verbs to a normalized vocabulary."
    columns:
      - name: verb_id
        tests: [unique, not_null]
  - name: ref_signal_type
    description: "Reference table for learning signal types."
    columns:
      - name: signal_type_key
        tests: [unique, not_null]
  - name: ref_membership_role
    description: "Reference table for membership roles (Learner, Instructor, TeachingAssistant, Proctor, Observer, etc.)."
    columns:
      - name: role_key
        tests: [unique, not_null]
  - name: ref_object_type
    description: "Reference table for normalized object types (ContentItem, AssessmentItem, Attempt, Annotation, LineItem, etc.)."
    columns:
      - name: object_type_key
        tests: [unique, not_null]
  - name: bridge_section_membership
    description: "Roster/assignment bridge: replaces StudentSectionAssociation + StaffSectionAssociation patterns."
    columns:
      - name: section_membership_id
        tests: [unique, not_null]
  - name: bridge_course_membership
    description: "Optional: membership at course level when sections are not available."
    columns:
      - name: course_membership_id
        tests: [unique, not_null]
  - name: bridge_content_skill_map
    description: "Maps content objects to skills for tagging and inference."
    columns:
      - name: content_skill_map_id
        tests: [unique, not_null]
  - name: bridge_item_skill_map
    description: "Maps assessment items to skills."
    columns:
      - name: item_skill_map_id
        tests: [unique, not_null]
  - name: bridge_skill_standard_map
    description: "Connects internal skills to external curriculum standards."
    columns:
      - name: skill_standard_map_id
        tests: [unique, not_null]
  - name: bridge_assessment_item_map
    description: "Assessment structure mapping; supports item analysis and blueprinting."
    columns:
      - name: assessment_item_map_id
        tests: [unique, not_null]
  - name: fact_learning_event
    description: "Atomic event fact table – each row represents a single learner/content/platform event."
    columns:
      - name: event_id
        tests: [unique, not_null]
  - name: fact_assessment_attempt
    description: "Assessment attempt fact – per learner per assessment execution."
    columns:
      - name: assessment_attempt_id
        tests: [unique, not_null]
  - name: fact_item_response
    description: "Best-practice grain for item analysis (difficulty, discrimination proxies), mastery modeling, and remediation."
    columns:
      - name: item_response_id
        tests: [unique, not_null]
  - name: fact_learning_signal
    description: "Learning signal fact – computed analytics like mastery or risk."
    columns:
      - name: learning_signal_id
        tests: [unique, not_null]
  - name: fact_variant_exposure
    description: "Variant exposure fact – connects learners to specific experiment variants."
    columns:
      - name: variant_exposure_id
        tests: [unique, not_null]
  - name: fact_ai_interaction
    description: "AI interaction fact – telemetry for AI experiences."
    columns:
      - name: ai_interaction_id
        tests: [unique, not_null]
  - name: fact_session_summary
    description: "Session summary fact – aggregated metrics over a learning session."
    columns:
      - name: session_summary_id
        tests: [unique, not_null]
  - name: fact_launch
    description: "Launch events used to connect context across standards and debugging adoption funnels."
    columns:
      - name: launch_id
        tests: [unique, not_null]
