name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
      DUCKDB_DATABASE: /tmp/ci_duckdb.db
      DBT_DUCKDB_SCHEMA: raw
      DAGSTER_HOME: /tmp/dagster
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e .[dev]
      - name: Compile Python modules
        run: python -m compileall dagster_project pipelines tests
      - name: Ruff lint
        run: ruff check .
      - name: dbt parse
        env:
          DBT_PROFILES_DIR: dbt
          GCP_PROJECT: dummy
          GCP_BQ_DATASET: raw
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake.json
        run: |
          echo '{}' > /tmp/fake.json
          dbt parse --project-dir dbt --profiles-dir dbt
      - name: Prepare DuckDB raw tables
        env:
          DBT_PROFILES_DIR: dbt
        run: python prepare_duckdb_raw.py
      - name: dbt build (DuckDB target)
        env:
          DBT_PROFILES_DIR: dbt
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Python unit tests
        run: pytest
