name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: Ruff lint
        run: |
          cd lineage
          uv run ruff check .
      - name: Type check
        run: |
          cd lineage
          uv run python -m py_compile lineage/src/lineage/**/*.py || true

  dbt-validate:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
      DUCKDB_DATABASE: /tmp/ci_duckdb.db
      DBT_DUCKDB_SCHEMA: raw
      DBT_RAW_SCHEMA: raw
      DAGSTER_HOME: /tmp/dagster
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: dbt parse
        env:
          DBT_PROFILES_DIR: ../dbt
          GCP_PROJECT: dummy
          GCP_BQ_DATASET: raw
          BQ_DATASET_PREFIX: test_
          BQ_LOCATION: US
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake.json
        run: |
          echo '{"project_id": "dummy", "private_key": "test", "client_email": "test@test.com"}' > /tmp/fake.json
          cd dbt
          dbt parse --profiles-dir . --project-dir .
      - name: dbt compile
        env:
          DBT_PROFILES_DIR: ../dbt
          GCP_PROJECT: dummy
          GCP_BQ_DATASET: raw
          BQ_DATASET_PREFIX: test_
          BQ_LOCATION: US
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake.json
        run: |
          echo '{"project_id": "dummy", "private_key": "test", "client_email": "test@test.com"}' > /tmp/fake.json
          cd dbt
          dbt compile --profiles-dir . --project-dir .

  dagster-validate:
    runs-on: ubuntu-latest
    env:
      DAGSTER_HOME: /tmp/dagster
      DBT_TARGET: duckdb
      DUCKDB_DATABASE: /tmp/ci_duckdb.db
      # Required environment variables for dlt and dbt
      MONGO_URI: mongodb://localhost:27017/test
      MONGO_DATABASE: test
      XAPI_LRS_ENDPOINT: https://example.com/xapi/statements
      GCP_PROJECT: test-project
      GCP_BQ_DATASET: test
      BQ_DATASET_PREFIX: test_
      BQ_LOCATION: US
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake.json
      DBT_PROFILES_DIR: ../dbt
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create fake credentials file
        run: |
          echo '{"project_id": "test", "private_key": "test", "client_email": "test@test.com"}' > /tmp/fake.json
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: Validate Dagster definitions
        run: |
          cd lineage
          uv run python -c "from lineage.definitions import defs; d = defs(); print(f'Loaded {len(list(d.assets))} assets, {len(list(d.resources))} resources')"
      - name: Run basic tests
        run: |
          cd lineage
          uv run pytest ../tests/test_imports.py ../tests/test_smoke_minimal.py -v
