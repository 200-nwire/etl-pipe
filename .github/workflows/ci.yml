name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: Ruff lint
        run: |
          cd lineage
          uv run ruff check .
      - name: Type check
        run: |
          cd lineage
          uv run python -m py_compile lineage/src/lineage/**/*.py || true

  dbt-validate:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
      DUCKDB_DATABASE: /tmp/ci_duckdb.db
      DBT_DUCKDB_SCHEMA: raw
      DBT_RAW_SCHEMA: raw
      DAGSTER_HOME: /tmp/dagster
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: dbt parse
        env:
          DBT_PROFILES_DIR: dbt
          GCP_PROJECT: dummy
          GCP_BQ_DATASET: raw
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake.json
        run: |
          echo '{}' > /tmp/fake.json
          cd dbt
          dbt parse --profiles-dir . --project-dir .
      - name: dbt compile
        env:
          DBT_PROFILES_DIR: dbt
        run: |
          cd dbt
          dbt compile --profiles-dir . --project-dir .

  dagster-validate:
    runs-on: ubuntu-latest
    env:
      DAGSTER_HOME: /tmp/dagster
      DBT_TARGET: duckdb
      DUCKDB_DATABASE: /tmp/ci_duckdb.db
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd lineage
          pip install uv
          uv sync
      - name: Validate Dagster definitions
        run: |
          cd lineage
          uv run python -c "from lineage.definitions import defs; print(f'Loaded {len(list(defs().assets))} assets')"
